<body>

  <!-- ============================================================
       EJERCICIO 9 · MI PORTFOLIO PROFESIONAL
       Lee ENUNCIADO.md. Rellena cada sección en su hueco.
       ============================================================ -->

  <!-- ===== NAVBAR =====
       Tu nombre/logo + enlaces: Sobre mí (#sobre-mi) · Habilidades (#habilidades)
       · Proyectos (#proyectos) · Formación (#formacion) · Contacto (#contacto) -->


  <main>

    <!-- ===== PORTADA · SOBRE MÍ (id="sobre-mi") =====
         Foto o avatar (img/foto.jpg), nombre, titular profesional, 2-3 líneas sobre ti,
         botones "Ver proyectos" y "Descargar CV" (docs/cv.pdf con atributo download) -->


    <!-- ===== HABILIDADES (id="habilidades") =====
         Grupos: Front-end · Back-end · Bases de datos · Herramientas · Idiomas
         Idea: una card por grupo con badges o iconos -->


    <!-- ===== PROYECTOS (id="proyectos") =====
         Mínimo 3 cards: captura (img/), descripción, badges de tecnologías,
         botones "Demo" y "Código" (GitHub). Idea JS: modal con el detalle -->


    <!-- ===== FORMACIÓN Y EXPERIENCIA (id="formacion") =====
         CFGS DAW, prácticas (FFEOE), cursos, certificaciones.
         Idea: list-group o accordion -->


    <!-- ===== CONTACTO (id="contacto") =====
         Formulario con validación (nombre, email, asunto, mensaje)
         + enlaces a email, LinkedIn y GitHub -->

  </main>

  <!-- ===== FOOTER =====
       © año + tu nombre · iconos de redes (con aria-label) · "Última actualización: ..." -->


  <!-- Botón para volver al índice del proyecto de clase (bórralo al publicar tu portfolio) -->
